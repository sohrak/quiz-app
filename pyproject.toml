[project]
name = "quiz-app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.0.0,<1.1",
]

[dependency-groups]
dev = [
    "flet-cli>=1.0.0,<1.1",
    "flet-desktop>=1.0.0,<1.1",
    "flet-web>=1.0.0,<1.1",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.0.0,<1.1",
    "pyright>=1.1.413",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
desktop_flavor = "light"    # Change to "full" to use flet-audio and flet-video
org = "com.mycompany"
product = "quiz-app"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
